<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>

<body>
    <button id="newBtn" command="show-modal" commandfor="my-dialog">New book</button>

    <dialog id="my-dialog">
        <form action="" id="myForm">
            <label for="title">Title:</label>
            <input type="text" id="title" required>

            <label for="author">Author:</label>
            <input type="text" id="author" required>

            <label for="pages">Number of pages:</label>
            <input type="number" id="pages" required>

            <label for="read">Book was read:</label>
            <select id="read">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>


        </form>
        <button type="submit" form="myForm" id="submitBtn">Submit</button>
        <button commandfor="my-dialog" command="close" id="closeBtn">Close</button>
    </dialog>
    <div id="library">

    </div>
</body>

</html>
